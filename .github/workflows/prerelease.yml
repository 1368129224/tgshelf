name: Dev Pre-release

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: prerelease-dev
  cancel-in-progress: true

jobs:
  prerelease:
    name: prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests before pre-release
        run: go test -race ./...

      - name: Build multi-arch pre-release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/tgshelf-linux-amd64 ./cmd/tgshelf
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/tgshelf-linux-arm64 ./cmd/tgshelf
          (cd dist && sha256sum tgshelf-linux-amd64 tgshelf-linux-arm64 > SHA256SUMS)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=prerelease
            type=raw,value=dev-${{ steps.vars.outputs.short_sha }}

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pre-release multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub Pre-release (dev-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_LOWER=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          BASE_TAG=$(git describe --tags --abbrev=0 --exclude="dev-latest" --exclude="*-*" 2>/dev/null || true)

          {
            echo "## Pre-release Build (\`dev\` @ \`${SHORT_SHA}\`)"
            echo ""
            echo "Automated pre-release built from commit \`${GITHUB_SHA}\` on \`dev\`."
            echo ""
            echo "### Docker Images (Pre-release)"
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE_LOWER}:dev"
            echo "docker pull ${IMAGE_LOWER}:prerelease"
            echo "docker pull ${IMAGE_LOWER}:dev-${SHORT_SHA}"
            echo "\`\`\`"
            echo ""
            if [ -n "$BASE_TAG" ]; then
              echo "### Changes since \`${BASE_TAG}\`"
              git log --no-merges --pretty=format:"- %h %s" "${BASE_TAG}..HEAD"
              echo ""
            else
              echo "### Recent Commits"
              git log -n 20 --no-merges --pretty=format:"- %h %s"
              echo ""
            fi
            echo ""
            echo "### Binary Checksums (SHA-256)"
            echo "\`\`\`text"
            cat dist/SHA256SUMS
            echo "\`\`\`"
          } > dist/RELEASE_NOTES.md

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --yes --cleanup-tag
          fi

          gh release create dev-latest \
            dist/tgshelf-linux-amd64 \
            dist/tgshelf-linux-arm64 \
            dist/SHA256SUMS \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Pre-release (dev @ ${SHORT_SHA})" \
            --notes-file dist/RELEASE_NOTES.md
