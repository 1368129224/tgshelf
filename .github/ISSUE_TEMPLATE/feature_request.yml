name: Feature Request
description: Suggest an idea for tgshelf
title: "[Feat] "
labels: ["enhancement"]
assignees:
  - iyear
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Make sure to browse the opened and closed issues before submit your issue.
        >
        > Please write the title and body in English (machine translation is fine)
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Write your feature request in the form of a proposal to be considered for implementation.
    validations:
      required: true

  - type: textarea
    id: workarounds
    attributes:
      label: Workarounds
      description: Are there any current workarounds that you're using that others in similar positions should know about?
    validations:
      required: true
